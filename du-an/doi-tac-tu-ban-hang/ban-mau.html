<title>Văn Phòng Shop</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Bố cục: hộp thư 3 cột — danh bạ AI | khung chat | hồ sơ AI. Điện thoại: danh bạ ↔ chat. */
:root{
  --bg:#eef1ee; --panel:#ffffff; --sunk:#f5f7f5; --line:#dde3de;
  --fg:#18231d; --muted:#5f6d64; --accent:#c8641e; --accent-soft:#fbeadd;
  --me:#1f4a3a; --me-fg:#f2f7f3; --ok:#2f7a4f; --warn:#b7791f; --ok-soft:#e3f1e8; --warn-soft:#fbf0dc;
  --f-ui:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111713; --panel:#18201b; --sunk:#141b16; --line:#2a352e;
  --fg:#e6ede8; --muted:#97a69c; --accent:#e8873f; --accent-soft:#3a281a;
  --me:#2f6b54; --me-fg:#f2f7f3; --ok:#6cc08f; --warn:#e2b25a; --ok-soft:#1d3326; --warn-soft:#3a2f18; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111713; --panel:#18201b; --sunk:#141b16; --line:#2a352e;
  --fg:#e6ede8; --muted:#97a69c; --accent:#e8873f; --accent-soft:#3a281a;
  --me:#2f6b54; --me-fg:#f2f7f3; --ok:#6cc08f; --warn:#e2b25a; --ok-soft:#1d3326; --warn-soft:#3a2f18; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:14px;line-height:1.5}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{height:100%;display:flex;flex-direction:column;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));gap:10px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand h1{font-size:18px;margin:0;font-weight:700;letter-spacing:-.01em}
.brand span{color:var(--muted);font-size:13px}
.pill{font-size:12px;padding:3px 10px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-weight:600;white-space:nowrap}
.shell{flex:1;min-height:0;display:grid;grid-template-columns:300px minmax(0,1fr) 270px;background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
/* Danh bạ */
.list{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:var(--sunk)}
.list-head{padding:14px 14px 8px;display:flex;flex-direction:column;gap:8px}
.today{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted)}
.today b{display:block;font-size:16px;color:var(--fg);font-variant-numeric:tabular-nums}
.scroll{overflow-y:auto;min-height:0;flex:1;padding:0 8px 12px}
.group{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:12px 8px 4px;font-weight:600}
.item{width:100%;display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px;border:0;background:none;border-radius:10px;text-align:left}
.item:hover{background:var(--panel)}
.item[aria-current="true"]{background:var(--panel);box-shadow:inset 3px 0 0 var(--accent)}
.av{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-weight:700;color:#fff;font-size:15px;flex:none}
.item .nm{font-weight:600;display:flex;gap:6px;align-items:baseline;min-width:0;white-space:nowrap}
.item .nm small{font-weight:400;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .last{color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{font-size:11px;font-weight:700;min-width:20px;height:20px;padding:0 6px;border-radius:99px;display:grid;place-items:center;background:var(--accent);color:#fff}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}
/* Chat */
.chat{display:flex;flex-direction:column;min-height:0;min-width:0}
.chat-head{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
.chat-head .who{min-width:0;flex:1}
.chat-head .who b{display:block}
.chat-head .who span{color:var(--muted);font-size:12.5px}
.back{display:none;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:4px 10px}
.msgs{flex:1;overflow-y:auto;padding:18px 16px;display:flex;flex-direction:column;gap:12px;min-height:0}
.day{align-self:center;font-size:11.5px;color:var(--muted);background:var(--sunk);padding:2px 10px;border-radius:99px}
.row{display:flex;gap:8px;align-items:flex-end;max-width:min(640px,92%)}
.row.me{align-self:flex-end;flex-direction:row-reverse}
.row .av{width:28px;height:28px;border-radius:9px;font-size:11px}
.bub{background:var(--sunk);border:1px solid var(--line);padding:9px 12px;border-radius:14px 14px 14px 4px;white-space:pre-wrap;overflow-wrap:anywhere;min-width:0}
.row.me .bub{background:var(--me);color:var(--me-fg);border-color:transparent;border-radius:14px 14px 4px 14px}
.from{font-size:11.5px;font-weight:600;color:var(--muted);margin-bottom:2px}
.time{font-size:11px;color:var(--muted);font-family:var(--f-mono);white-space:nowrap}
.card{border:1px solid var(--line);border-radius:12px;background:var(--panel);overflow:hidden;max-width:min(560px,92%)}
.card .ch{display:flex;justify-content:space-between;gap:8px;padding:8px 12px;background:var(--warn-soft);color:var(--warn);font-size:12px;font-weight:600}
.card.done .ch{background:var(--ok-soft);color:var(--ok)}
.card .cb{padding:10px 12px;white-space:pre-wrap}
.card .ca{display:flex;gap:8px;padding:0 12px 12px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 12px;font-weight:600;font-size:13px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:0 16px 8px}
.chip{border:1px solid var(--line);background:var(--sunk);border-radius:99px;padding:4px 10px;font-size:12.5px}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.compose{display:flex;gap:8px;padding:10px 16px 14px;border-top:1px solid var(--line);align-items:flex-end}
.compose textarea{flex:1;resize:none;border:1px solid var(--line);background:var(--sunk);color:var(--fg);border-radius:12px;padding:10px 12px;font:inherit;min-height:42px;max-height:140px}
.note{font-size:11.5px;color:var(--muted);padding:0 16px 10px}
/* Hồ sơ */
.info{border-left:1px solid var(--line);overflow-y:auto;padding:18px 16px;display:flex;flex-direction:column;gap:16px;background:var(--sunk)}
.info h3{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 6px}
.info p{margin:0}
.info ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:3px}
.perm{display:grid;grid-template-columns:1fr auto;gap:4px 8px;font-size:13px}
.perm em{font-style:normal;font-size:12px;font-weight:600;padding:0 8px;border-radius:99px}
.y{background:var(--ok-soft);color:var(--ok)} .a{background:var(--warn-soft);color:var(--warn)}
.sched{font-family:var(--f-mono);font-size:12.5px}
.typing{color:var(--muted);font-style:italic}
@media (max-width:1100px){.shell{grid-template-columns:280px minmax(0,1fr)}.info{display:none}}
@media (max-width:720px){
  .shell{grid-template-columns:1fr}
  .shell .chat{display:none}
  .shell.open .list{display:none}
  .shell.open .chat{display:flex}
  .back{display:inline-block}
  .brand span{display:none}
}
@media (prefers-reduced-motion:no-preference){.row,.card{animation:in .18s ease-out}@keyframes in{from{transform:translateY(4px);opacity:.4}}}
</style>

<div class="app">
  <header class="top">
    <div class="brand"><h1>Văn Phòng Shop</h1><span>Mỗi AI một việc. Nhắn với từng người như nhắn tin.</span></div>
    <span class="pill">Bản mẫu · số liệu minh hoạ</span>
  </header>
  <div class="shell" id="shell">
    <aside class="list">
      <div class="list-head">
        <div class="today">
          <div><b id="kWait">0</b>chờ bạn duyệt</div>
          <div><b>148</b>đơn đêm qua</div>
          <div><b>12,4tr</b>doanh thu hôm qua</div>
        </div>
      </div>
      <nav class="scroll" id="list" aria-label="Danh bạ AI"></nav>
    </aside>
    <section class="chat" aria-live="polite">
      <div class="chat-head">
        <button class="back" id="back" aria-label="Quay lại danh bạ">‹</button>
        <div class="av" id="hAv"></div>
        <div class="who"><b id="hName"></b><span id="hRole"></span></div>
      </div>
      <div class="msgs" id="msgs"></div>
      <div class="chips" id="chips"></div>
      <form class="compose" id="form">
        <textarea id="box" rows="1" placeholder="Nhắn cho AI…"></textarea>
        <button class="btn pri" id="send" type="submit">Gửi</button>
      </form>
      <div class="note" id="note">AI soạn sẵn, bạn bấm duyệt thì việc mới được gửi đi.</div>
    </section>
    <aside class="info" id="info"></aside>
  </div>
</div>

<script>
const SHOP = "Shop mỹ phẩm thiên nhiên bán trên TikTok Shop, Shopee và fanpage; 2 người vận hành; 148 đơn đêm qua, doanh thu hôm qua 12,4 triệu.";
const TEAM = [
 {id:"chung", group:"Phòng chung", name:"Cả đội", role:"Gọi @tên để giao việc cho đúng người", color:"#4b5d52", initials:"⌂",
  sched:"Luôn mở", does:["Bạn nhắn một lần, Chi chia việc cho đúng AI","Gõ @Lan, @Khoa… để gọi riêng"], perms:[["Đọc tin của cả đội","y"]],
  chips:["Tuần này nên đẩy sản phẩm nào?","@Khoa tắt chiến dịch đang lỗ","Ai đang kẹt việc?"],
  seed:[["Chi","07:30","Chào buổi sáng. Hôm nay có 3 việc chờ bạn duyệt: Lan 2 phản hồi đánh giá, Khoa 1 đề xuất tắt quảng cáo."],["Khoa","07:32","Chiến dịch \"Serum C – video 3\" vượt 80.000đ/đơn 3 ngày liền. Em đề xuất tắt, chờ anh/chị duyệt."]]},
 {id:"chi", group:"Điều hành", name:"Chi", role:"Trợ lý trưởng", color:"#1f4a3a", initials:"C",
  sched:"07:30 báo cáo sáng · 21:00 tổng kết",
  does:["Báo cáo sáng: đơn, doanh thu, việc tồn","Gom mọi việc chờ duyệt về một chỗ","Chia việc cho các AI khác, nhắc hạn"],
  perms:[["Đọc dữ liệu shop","y"],["Giao việc cho AI khác","y"],["Gửi tin ra ngoài","a"]],
  chips:["Hôm nay tôi cần làm gì?","Tóm tắt tuần này","Ai đang kẹt việc?"],
  seed:[["Chi","07:30","Báo cáo sáng 14/11\n• 148 đơn mới, 3 đơn có nguy cơ huỷ (Minh đang theo)\n• 1 đánh giá 2 sao, Lan đã soạn phản hồi\n• Quảng cáo: 7 chiến dịch tốt, 1 đang lỗ\nViệc của bạn hôm nay: duyệt 3 mục, mất khoảng 5 phút."]]},
 {id:"lan", group:"Bán hàng", name:"Lan", role:"Chăm sóc khách", color:"#c8641e", initials:"L",
  sched:"Trực tin nhắn 24/7 · báo mỗi 2 giờ",
  does:["Trả lời câu hỏi thường gặp trên Zalo, Messenger, TikTok","Soạn phản hồi đánh giá xấu","Xin số điện thoại khi khách hỏi giá sỉ"],
  perms:[["Đọc tin nhắn","y"],["Trả lời câu hỏi có sẵn","y"],["Gửi phản hồi đánh giá","a"]],
  chips:["Có khách nào đang chờ lâu?","Viết mẫu trả lời khách hỏi ship","Tuần này khách hay phàn nàn gì?"],
  seed:[["Lan","06:50","Đêm qua em trả lời 41 tin nhắn. Có 1 đánh giá 2 sao cần anh/chị xem."],
        ["card","06:51","Phản hồi đánh giá 2 sao · đơn #TK-9821","Dạ shop xin lỗi chị vì hộp serum bị móp khi giao. Shop gửi bù chị 1 hộp mới trong hôm nay và tặng mã giảm 15% cho lần sau ạ."]]},
 {id:"minh", group:"Bán hàng", name:"Minh", role:"Đơn hàng & kho", color:"#3b6ea5", initials:"M",
  sched:"4 ca/ngày: 07:00 · 11:00 · 15:00 · 20:00",
  does:["Quét đơn mới, đơn sắp trễ hạn giao","Theo đơn huỷ, hoàn","Cảnh báo sắp hết hàng"],
  perms:[["Đọc đơn, tồn kho","y"],["Nhắc đơn vị vận chuyển","a"]],
  chips:["Đơn nào sắp trễ hạn?","Sản phẩm nào sắp hết?","Tỉ lệ hoàn tuần này?"],
  seed:[["Minh","07:00","Ca sáng: 148 đơn mới. 3 đơn khách chưa nghe máy 2 lần, nguy cơ huỷ. Serum C còn 34 hộp, đủ bán khoảng 4 ngày."]]},
 {id:"vy", group:"Tăng trưởng", name:"Vy", role:"Nội dung & video", color:"#9c4a8b", initials:"V",
  sched:"Lên lịch 3 bài/ngày · thứ 2 lên kế hoạch tuần",
  does:["Viết bài fanpage theo giọng shop","Viết kịch bản video ngắn","Lên lịch đăng, đo bài nào ra đơn"],
  perms:[["Soạn bài, kịch bản","y"],["Đăng bài","a"]],
  chips:["Viết 3 ý video cho serum C","Bài nào tuần trước ra đơn nhiều nhất?","Lên lịch đăng tuần tới"],
  seed:[["Vy","08:00","Tuần trước video \"trước–sau 7 ngày\" ra 23 đơn, gấp 3 lần video giới thiệu. Em đề xuất tuần này làm thêm 2 video cùng kiểu."]]},
 {id:"khoa", group:"Tăng trưởng", name:"Khoa", role:"Quảng cáo", color:"#a33b3b", initials:"K",
  sched:"Kiểm tra mỗi 3 giờ · cắt lỗ theo luật bạn đặt",
  does:["Theo dõi chi phí/đơn từng chiến dịch","Đề xuất tắt, tăng ngân sách","Báo cáo về điện thoại"],
  perms:[["Đọc số liệu quảng cáo","y"],["Tắt chiến dịch lỗ","a"],["Tăng ngân sách","a"]],
  chips:["Chiến dịch nào đang lỗ?","Luật cắt lỗ đang đặt là gì?","Nên dồn tiền vào đâu?"],
  seed:[["card","07:32","Đề xuất tắt chiến dịch \"Serum C – video 3\"","Chi phí/đơn 96.000đ, vượt mức trần 80.000đ ba ngày liền. Đã tiêu 1,9 triệu, ra 20 đơn."]]},
 {id:"an", group:"Tăng trưởng", name:"An", role:"Số liệu & lãi lỗ", color:"#5a6b2f", initials:"A",
  sched:"21:00 mỗi tối · chủ nhật báo cáo tuần",
  does:["Tính lãi thật sau phí sàn, ship, quảng cáo","Định giá sản phẩm mới","So tuần này với tuần trước"],
  perms:[["Đọc doanh thu, chi phí","y"]],
  chips:["Lãi thật hôm qua bao nhiêu?","Định giá cho combo mới","Sản phẩm nào lãi ít nhất?"],
  seed:[["An","21:00","Hôm qua doanh thu 12,4 triệu, lãi thật sau phí sàn, ship, quảng cáo khoảng 2,1 triệu (17%). Combo dưỡng ẩm đang lãi thấp nhất: 6%."]]},
 {id:"tu", group:"Tăng trưởng", name:"Tú", role:"Săn KOC & cộng tác viên", color:"#2f7f86", initials:"T",
  sched:"Thứ 3, thứ 6 · tìm và nhắn mời",
  does:["Tìm KOC hợp ngành, lọc theo tương tác thật","Soạn tin mời gửi mẫu","Theo ai đã nhận mẫu, ai đã đăng"],
  perms:[["Tìm, lọc KOC","y"],["Gửi tin mời","a"]],
  chips:["Tìm 10 KOC mỹ phẩm dưới 50k follow","Ai nhận mẫu chưa đăng?"],
  seed:[["Tú","10:15","8 KOC đã nhận mẫu, 5 người đã đăng. Video của @thuha.review ra 11 đơn, em đề xuất hợp tác dài."]]},
 {id:"huong", group:"Học & tiến bộ", name:"Hướng", role:"Huấn luyện viên chủ shop", color:"#7a5a2a", initials:"H",
  sched:"Tối chủ nhật nhìn lại tuần · nhắc 1 việc mỗi sáng",
  does:["Giải thích vì sao đội AI đề xuất như vậy","Kèm chủ shop từng bước tới khi tự làm được","Nhìn lại tuần: được gì, kẹt đâu, tuần sau làm gì"],
  perms:[["Đọc báo cáo của cả đội","y"]],
  chips:["Vì sao Khoa muốn tắt chiến dịch?","Tôi nên học gì trước?","Nhìn lại tuần này giúp tôi"],
  seed:[["Hướng","08:30","Việc nhỏ hôm nay: mở báo cáo của An, xem cột \"lãi thật\". Đó là con số quyết định nên bán tiếp hay dừng một sản phẩm. Có chỗ nào chưa rõ thì hỏi mình."]]}
];
const byName = Object.fromEntries(TEAM.map(a=>[a.name,a]));
const state = {cur:"chi", threads:{}, unread:{}, busy:false};
TEAM.forEach(a=>{
  state.threads[a.id] = a.seed.map(s=> s[0]==="card" ? {kind:"card",time:s[1],title:s[2],body:s[3],done:false,from:a.id==="chung"?"Khoa":a.name}
                                                    : {kind:"msg",from:s[0],time:s[1],text:s[2]});
  state.unread[a.id] = a.id==="chi"?0:a.seed.length;
});
const $ = id=>document.getElementById(id);
const esc = s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const now = ()=>new Date().toTimeString().slice(0,5);
function av(a, small){return `<div class="av" style="background:${a.color}${small?";width:28px;height:28px;border-radius:9px;font-size:11px":""}">${esc(a.initials)}</div>`}
function pending(){return Object.values(state.threads).flat().filter(m=>m.kind==="card"&&!m.done).length}
function lastText(a){const t=state.threads[a.id];const m=t[t.length-1];if(!m)return"";return m.kind==="card"?"Chờ duyệt: "+m.title:(m.from==="me"?"Bạn: ":"")+m.text}

function renderList(){
  let html="",g="";
  for(const a of TEAM){
    if(a.group!==g){g=a.group;html+=`<div class="group">${esc(g)}</div>`}
    const u=state.unread[a.id], cur=a.id===state.cur;
    html+=`<button class="item" data-id="${a.id}" aria-current="${cur}">${av(a)}
      <div style="min-width:0"><div class="nm">${esc(a.name)}<small>${esc(a.role)}</small></div><div class="last">${esc(lastText(a))}</div></div>
      ${u&&!cur?`<span class="badge">${u}</span>`:`<span class="dot" title="Đang chạy"></span>`}</button>`;
  }
  $("list").innerHTML=html; $("kWait").textContent=pending();
}
function renderInfo(a){
  $("info").innerHTML=`
    <div>${av(a)}<p style="margin-top:8px;font-weight:700;font-size:16px">${esc(a.name)}</p><p style="color:var(--muted)">${esc(a.role)}</p></div>
    <div><h3>Lịch chạy</h3><p class="sched">${esc(a.sched)}</p></div>
    <div><h3>Việc làm</h3><ul>${a.does.map(d=>`<li>${esc(d)}</li>`).join("")}</ul></div>
    <div><h3>Quyền</h3><div class="perm">${a.perms.map(p=>`<span>${esc(p[0])}</span><em class="${p[1]}">${p[1]==="y"?"tự làm":"cần duyệt"}</em>`).join("")}</div></div>`;
}
function renderMsgs(){
  const a=TEAM.find(x=>x.id===state.cur);
  let html=`<div class="day">Hôm nay</div>`;
  state.threads[a.id].forEach((m,i)=>{
    if(m.kind==="card"){
      html+=`<div class="card ${m.done?"done":""}"><div class="ch"><span>${m.done?esc(m.done):"Chờ bạn duyệt"} · ${esc(m.from)}</span><span class="time">${esc(m.time)}</span></div>
        <div class="cb"><b>${esc(m.title)}</b>\n${esc(m.body)}</div>
        ${m.done?"":`<div class="ca"><button class="btn pri" data-act="ok" data-i="${i}">Duyệt</button><button class="btn" data-act="edit" data-i="${i}">Sửa</button><button class="btn" data-act="no" data-i="${i}">Bỏ qua</button></div>`}</div>`;
    } else if(m.from==="me"){
      html+=`<div class="row me"><div class="bub">${esc(m.text)}</div><span class="time">${esc(m.time)}</span></div>`;
    } else {
      const who=byName[m.from]||a;
      html+=`<div class="row">${av(who,1)}<div style="min-width:0">${a.id==="chung"?`<div class="from">${esc(who.name)} · ${esc(who.role)}</div>`:""}<div class="bub ${m.typing?"typing":""}">${esc(m.text)}</div></div><span class="time">${esc(m.time)}</span></div>`;
    }
  });
  $("msgs").innerHTML=html; $("msgs").scrollTop=$("msgs").scrollHeight;
}
function open(id, show){
  state.cur=id; state.unread[id]=0;
  const a=TEAM.find(x=>x.id===id);
  $("hAv").outerHTML=`<div class="av" id="hAv" style="background:${a.color}">${esc(a.initials)}</div>`;
  $("hName").textContent=a.name; $("hRole").textContent=a.role+" · "+a.sched;
  $("box").placeholder=`Nhắn cho ${a.name}…`;
  $("chips").innerHTML=a.chips.map(c=>`<button class="chip" type="button">${esc(c)}</button>`).join("");
  renderList(); renderMsgs(); renderInfo(a);
  if(show) $("shell").classList.add("open");
  try{localStorage.setItem("vps-cur",id)}catch(e){}
}

// ===== AI trả lời =====
let samplePromise = window.claude?.use ? window.claude.use("sample").catch(()=>null) : Promise.resolve(null);
function teamStatus(){return TEAM.filter(a=>a.id!=="chung").map(a=>`- ${a.name} (${a.role}): ${lastText(a)}`).join("\n")}
function rules(a){
  return `Bạn là "${a.name}", nhân sự AI phụ trách "${a.role}" trong đội AI của một shop bán hàng online Việt Nam.
Bối cảnh shop: ${SHOP}
Việc của bạn: ${a.does.join("; ")}. Lịch chạy: ${a.sched}.
Quyền: ${a.perms.map(p=>p[0]+(p[1]==="y"?" (tự làm)":" (phải chờ chủ shop duyệt)")).join("; ")}.
Tình hình cả đội lúc này:\n${teamStatus()}
Cách trả lời: tiếng Việt, xưng "em", gọi chủ shop là "anh/chị"; ngắn gọn 2–5 câu hoặc gạch đầu dòng; đưa số liệu minh hoạ hợp lý khi cần; việc gửi ra ngoài, tiêu tiền, đăng bài thì nói rõ "em soạn sẵn, chờ anh/chị duyệt". Việc ngoài phần mình thì nói sẽ chuyển cho AI phụ trách (gọi đúng tên). Không dùng markdown đậm.`;
}
function fallback(a,text){
  if(a.id==="chung") return [{ai:"Chi",text:"Em đã nhận. Em chia việc cho đúng người và báo lại anh/chị trong ít phút (bản mẫu đang chạy câu trả lời có sẵn)."}];
  return [{ai:a.name,text:`Em đã nhận việc: "${text.slice(0,80)}". Em sẽ làm và báo lại anh/chị. (Bản mẫu: mở trang trong claude.ai để AI trả lời thật.)`}];
}
async function ask(a,text){
  const sample = await samplePromise;
  const hist = state.threads[a.id].filter(m=>m.kind==="msg"&&!m.typing).slice(-10)
    .map(m=>m.from==="me"?`Chủ shop: ${m.text}`:`${m.from}: ${m.text}`).join("\n");
  if(!sample) return fallback(a,text);
  if(a.id==="chung"){
    const prompt = `Đây là phòng chat chung của đội AI một shop online Việt Nam. Bối cảnh: ${SHOP}
Thành viên:\n${TEAM.filter(x=>x.id!=="chung").map(x=>`- ${x.name}: ${x.role}; việc: ${x.does.join("; ")}`).join("\n")}
Tình hình:\n${teamStatus()}
Lịch sử gần đây:\n${hist}
Chủ shop vừa nhắn: "${text}"
Nếu chủ shop gọi @tên thì người đó trả lời. Nếu không, Chi (trợ lý trưởng) trả lời trước và có thể gọi thêm 1–2 người liên quan trả lời tiếp. Mỗi người xưng "em", gọi "anh/chị", 1–3 câu, việc gửi ra ngoài hay tiêu tiền thì nói chờ duyệt.
Chỉ trả về JSON: mảng 1–3 phần tử dạng {"ai":"Tên","text":"..."}.`;
    const arr = await sample.json(prompt,{cache:false,modelTier:"quick"});
    return (Array.isArray(arr)?arr:[]).filter(x=>x&&byName[x.ai]&&x.text).slice(0,3);
  }
  const turns=[{role:"user",content:rules(a)}];
  state.threads[a.id].filter(m=>m.kind==="msg"&&!m.typing).slice(-10).forEach(m=>turns.push({role:m.from==="me"?"user":"assistant",content:m.text}));
  if(turns[turns.length-1].role!=="user") turns.push({role:"user",content:text});
  const {text:ans}=await sample(turns,{cache:false,modelTier:"quick"});
  return [{ai:a.name,text:ans}];
}
async function send(text){
  text=text.trim(); if(!text||state.busy) return;
  const a=TEAM.find(x=>x.id===state.cur), th=state.threads[a.id];
  th.push({kind:"msg",from:"me",time:now(),text});
  const tmp={kind:"msg",from:a.id==="chung"?"Chi":a.name,time:now(),text:"Đang soạn…",typing:true};
  th.push(tmp); state.busy=true; $("send").disabled=true; renderMsgs(); renderList();
  try{
    const out=await ask(a,text);
    th.splice(th.indexOf(tmp),1);
    (out.length?out:fallback(a,text)).forEach(o=>th.push({kind:"msg",from:o.ai,time:now(),text:o.text}));
  }catch(e){
    th.splice(th.indexOf(tmp),1);
    const msg = e&&e.code==="not_granted" ? "Bạn chưa cho phép trang dùng Claude, nên AI trả lời bằng câu có sẵn."
      : e&&e.code==="rate_limited" ? "Đang hết lượt hỏi Claude, thử lại sau ít phút." : "Không kết nối được AI, thử gửi lại.";
    if(e&&e.code==="not_granted") samplePromise=Promise.resolve(null);
    fallback(a,text).forEach(o=>th.push({kind:"msg",from:o.ai,time:now(),text:o.text}));
    $("note").textContent=msg;
  }
  state.busy=false; $("send").disabled=false;
  if(state.cur===a.id) renderMsgs(); renderList();
}

$("list").addEventListener("click",e=>{const b=e.target.closest(".item");if(b)open(b.dataset.id,true)});
$("back").addEventListener("click",()=>$("shell").classList.remove("open"));
$("chips").addEventListener("click",e=>{const c=e.target.closest(".chip");if(c)send(c.textContent)});
$("form").addEventListener("submit",e=>{e.preventDefault();const v=$("box").value;$("box").value="";send(v)});
$("box").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();$("form").requestSubmit()}});
$("msgs").addEventListener("click",e=>{
  const b=e.target.closest("[data-act]"); if(!b) return;
  const m=state.threads[state.cur][+b.dataset.i];
  if(b.dataset.act==="edit"){ $("box").value=`Sửa lại "${m.title}": `; $("box").focus(); return; }
  m.done = b.dataset.act==="ok" ? "Đã duyệt, đã gửi" : "Đã bỏ qua";
  renderMsgs(); renderList();
});
let start="chi"; try{start=localStorage.getItem("vps-cur")||"chi"}catch(e){}
open(TEAM.some(a=>a.id===start)?start:"chi", false);
</script>
