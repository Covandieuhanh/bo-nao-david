<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dựng video</title>
<style>
:root{--nen:#f6f5f2;--the:#fff;--chu:#1d1d1b;--phu:#6b6a66;--vien:#e3e1dc;--nhan:#e8742c;--xanh:#2e8b57;--do:#c0392b;--vang:#c98a00}
@media (prefers-color-scheme:dark){:root{--nen:#151514;--the:#1f1f1d;--chu:#ecebe7;--phu:#9a9892;--vien:#33322f}}
*{box-sizing:border-box}body{margin:0;background:var(--nen);color:var(--chu);font:16px/1.55 -apple-system,system-ui,sans-serif}
.khung{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
aside{border-right:1px solid var(--vien);padding:18px 14px;background:var(--the);display:flex;flex-direction:column;gap:14px}
main{padding:28px 32px;max-width:900px;min-width:0;overflow-wrap:anywhere}
h1{font-size:20px;margin:0}h2{font-size:17px;margin:22px 0 8px}
aside h1{font-size:17px;cursor:pointer}
button{font:inherit;font-size:15px;border:1px solid var(--vien);background:var(--the);color:var(--chu);border-radius:10px;padding:8px 14px;cursor:pointer}
button:hover{border-color:var(--phu)}
button.chinh{background:var(--nhan);border-color:var(--nhan);color:#fff;font-weight:600}
button.to{padding:12px 20px;font-size:16px}
button.nho{font-size:13px;padding:3px 10px}
button:disabled{opacity:.5;cursor:default}
button.dung{border-color:var(--do);color:var(--do)}
.cham{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--vien);flex:0 0 9px}
.cham.cho{background:var(--nhan)}.cham.chay{background:var(--xanh);animation:nhip 1.6s infinite}.cham.loi{background:var(--do)}.cham.dung,.cham.hang{background:var(--vang)}.cham.xong{background:var(--phu)}
@keyframes nhip{50%{opacity:.35}}
.nhom{font-size:12px;color:var(--phu);margin:0 0 4px 4px}
.viec{display:flex;gap:9px;align-items:center;padding:7px 8px;border-radius:8px;cursor:pointer}.viec:hover,.viec.chon{background:var(--nen)}
.viec span:last-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
details.xong>summary{font-size:12px;color:var(--phu);cursor:pointer;margin-left:4px;list-style:none}
details>summary::-webkit-details-marker{display:none}
.the{background:var(--the);border:1px solid var(--vien);border-radius:14px;padding:20px;margin:16px 0}
.the.noi{border-color:var(--nhan)}
.the h2:first-child{margin-top:0}
.trang{display:flex;gap:10px;align-items:center;color:var(--phu);margin-top:6px}
.dau{display:flex;align-items:center;gap:12px}
.menu{position:relative;margin-left:auto}.menu>summary{cursor:pointer;border:1px solid var(--vien);border-radius:10px;padding:4px 12px;font-size:18px;line-height:1.2;list-style:none}
.menu .ds-menu{position:absolute;right:0;top:110%;background:var(--the);border:1px solid var(--vien);border-radius:12px;padding:8px;min-width:240px;z-index:5;display:flex;flex-direction:column;gap:4px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.menu .ds-menu button{text-align:left;border:0}.menu .ds-menu button:hover{background:var(--nen)}
.menu .ds-menu label{margin:4px 8px 0}.menu .ds-menu select{margin:0 0 4px}
details.chitiet{margin-top:24px;border-top:1px solid var(--vien);padding-top:12px}
details.chitiet>summary,details.gon>summary{cursor:pointer;color:var(--phu);font-size:14px}
.buoc{display:flex;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--vien);font-size:14px}
.buoc .loai{font-size:12px;color:var(--phu);margin-left:auto;white-space:nowrap}.buoc .lai{font-size:12px;padding:2px 8px}
pre{white-space:pre-wrap;word-break:break-word;background:var(--nen);padding:12px;border-radius:8px;max-height:420px;overflow:auto;font:13px/1.45 ui-monospace,Menlo,monospace}
textarea,input,select{font:inherit;width:100%;padding:10px;border:1px solid var(--vien);border-radius:10px;background:var(--the);color:var(--chu)}
label{display:block;margin:12px 0 4px;color:var(--phu);font-size:14px}
video{width:100%;max-height:520px;background:#000;border-radius:10px}
.hang{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}.mo{color:var(--phu)}
.tha{overflow-wrap:anywhere;min-width:0;border:2px dashed var(--vien);border-radius:14px;padding:40px 16px;text-align:center;cursor:pointer;color:var(--phu);font-size:17px}.tha.tren{border-color:var(--nhan);color:var(--nhan)}
.tha small{font-size:14px}
.tien{height:8px;background:var(--nen);border-radius:4px;overflow:hidden;margin-top:8px}.tien>div{height:100%;width:0;background:var(--nhan)}
.nen-hoi{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:9}
.hop-hoi{background:var(--the);border:1px solid var(--vien);border-radius:14px;padding:20px;max-width:560px;width:100%;white-space:pre-wrap}
.duyet{max-width:720px;max-height:86vh;display:flex;flex-direction:column;white-space:normal}
.ds-tep{overflow-y:auto;flex:1;margin-top:8px}.dong-tep{display:flex;gap:10px;align-items:center;padding:8px;border-radius:8px;cursor:pointer;border-bottom:1px solid var(--vien)}.dong-tep:hover{background:var(--nen)}
.dong-tep img,.dong-tep .o{width:64px;height:40px;object-fit:cover;border-radius:6px;background:var(--nen);flex:0 0 64px;display:flex;align-items:center;justify-content:center}
.dong-tep>div:last-child{min-width:0;overflow-wrap:anywhere}.dong-tep small{display:block;color:var(--phu)}.chip{font-size:14px;padding:6px 12px;flex:0 0 auto!important;white-space:nowrap}.hang-chip{display:flex;gap:6px;overflow-x:auto;scrollbar-width:thin;scrollbar-color:var(--vien) transparent;margin-top:10px;padding-bottom:4px}
details.them{margin-top:18px}details.them>summary{cursor:pointer;color:var(--phu)}
.hm{font-size:12px;color:var(--phu)}.hm>summary{cursor:pointer;list-style:none;display:flex;gap:6px;align-items:center}
.hm .d{display:flex;align-items:center;gap:6px;margin:5px 0}
.hm .t{flex:1;height:5px;border-radius:3px;background:var(--vien);overflow:hidden;min-width:40px}.hm .t i{display:block;height:100%}
.hm button{font-size:11px;padding:1px 6px;margin-left:auto}.hm .canh{color:var(--do);margin-top:3px}
.o-viec{display:flex;gap:12px;align-items:center;padding:14px 16px;border:1px solid var(--vien);border-radius:12px;background:var(--the);margin:8px 0;cursor:pointer}
.o-viec b{flex:1;min-width:0}.o-viec:hover{border-color:var(--phu)}
input[type=radio],input[type=checkbox]{width:auto!important;display:inline-block;margin:0 6px 0 0;vertical-align:middle}
@media (max-width:760px){.khung{grid-template-columns:1fr;grid-template-rows:auto 1fr;min-height:0}aside{border-right:0;border-bottom:1px solid var(--vien);padding:12px 16px;gap:10px}main{padding:16px}#ds{display:flex;gap:6px;overflow-x:auto}#ds .nhom,#ds details.xong{display:none}.viec{flex:0 0 auto;border:1px solid var(--vien)}.buoc .lai{display:none}.hang button{flex:1}video{max-height:60vh}}
</style></head><body>
<div class="khung">
<aside><h1 onclick="veNha()">Dựng video</h1><button class="chinh to" onclick="moMoi()">+ Việc mới</button><div id="ds"></div><details id="hm" class="hm" style="margin-top:auto"></details></aside>
<main id="chinh"></main>
</div>
<script>
const $=s=>document.querySelector(s);let chon=null,hen=null;
const BIEU={'xep-hang':'⏳','bo-qua':'–','da-dung':'⏸',xong:'✅','da-duyet':'✅','dang-chay':'⏳',loi:'❌','cho-duyet':'🟠',chua:'·'};
const LOAI={'co-dinh':'máy','ai':'AI làm theo skill','claude':'AI (kiểu cũ)','duyet':'David duyệt'};
const esc=s=>(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
async function api(u,d){const r=await fetch(u,d?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)}:{});const j=await r.json();if(!r.ok)alert(j.loi||'lỗi');return j}
const MED=p=>/\.(mp4|mov|m4v)$/i.test(p),TIENG=p=>/\.(wav|mp3|m4a|aac|flac|ogg)$/i.test(p);
function nutTep(ten,p,co=true){return co?`<button class="nho" onclick="xemTep(this,'${encodeURIComponent(p)}')">Xem</button><button class="nho" onclick="moFinder('${ten}','${encodeURIComponent(p)}')">Mở trong Finder</button>`:'<span class="mo">không còn file</span>'}
function veNguon(d){const n=d.nguon||[],f=d.file_do||[];if(!n.length&&!f.length)return'';
let h=`<div id="nguonThe"><h2>Nguồn${n.length>1?` (${n.length} clip, thứ tự ghép)`:''}</h2>`+n.map((x,i)=>`<div style="display:flex;gap:10px;align-items:center;margin:8px 0">${x.co&&!x.p.includes('/CloudStorage/')&&!TIENG(x.p)?`<img src="/api/anh-nho?p=${encodeURIComponent(x.p)}" style="width:96px;border-radius:6px" onerror="this.remove()">`:''}<div style="min-width:0"><b>${n.length>1?(i+1)+'. ':''}${esc(x.ten)}</b>${x.giay?` · ${Math.floor(x.giay/60)}:${String(Math.round(x.giay%60)).padStart(2,'0')}`:''}<br><small class="mo" style="word-break:break-all">${esc(x.p)}</small><div class="hang" style="margin-top:4px">${nutTep(d.ten,x.p,x.co)}</div><div class="xemo"></div></div></div>`).join('');
if(f.length)h+=`<h2>File đang làm</h2>`+f.map(x=>`<div style="margin:6px 0"><b>${esc(x.nhan)}</b> <small class="mo">${esc(x.luc)}</small><div class="hang" style="margin-top:4px">${nutTep(d.ten,x.p)}</div><div class="xemo"></div></div>`).join('');
return h+'</div>'}
function xemTep(b,p){const o=b.closest('.hang').nextElementSibling;if(o.innerHTML){o.innerHTML='';return}const u='/tep?p='+p;const pp=decodeURIComponent(p);o.innerHTML=TIENG(pp)?`<audio controls autoplay preload="metadata" src="${u}" style="width:100%;margin-top:6px"></audio>`:MED(pp)?`<video controls autoplay preload="metadata" src="${u}" style="max-width:100%;margin-top:6px"></video>`:`<a href="${u}" target="_blank"><img src="${u}" style="max-width:100%;margin-top:6px;border-radius:6px"></a>`}
async function moFinder(ten,p){await api('/api/mo-finder',{ten,p:decodeURIComponent(p)})}
function trangThai(v){if(v.trang_thai=='cho-duyet')return['cho','Chờ bạn duyệt'];if(v.trang_thai=='loi')return['loi','Bị lỗi'];if(v.trang_thai=='da-dung')return['dung','Đã dừng'];
if(v.dang_chay)return v.trang_thai=='xep-hang'?['hang','Đang xếp hàng']:['chay','Đang chạy'];return v.trang_thai=='xong'||!v.dang?['xong','Xong']:['dung','Chưa chạy xong']}
async function danhSach(){const ds=await api('/api/viec');window.dsViec=ds;const o=v=>{const[c,t]=trangThai(v);return`<div class="viec ${v.ten==chon?'chon':''}" title="${esc(t)}" onclick="xem('${v.ten}')"><span class="cham ${c}"></span><span>${esc(v.ten)}</span></div>`};
const can=ds.filter(v=>['cho','loi','dung'].includes(trangThai(v)[0])),chay=ds.filter(v=>['chay','hang'].includes(trangThai(v)[0])),xong=ds.filter(v=>trangThai(v)[0]=='xong');
const mo=document.querySelector('#ds details.xong')?.open;
const h=(can.length?`<div class="nhom">Cần bạn</div>${can.map(o).join('')}`:'')+(chay.length?`<div class="nhom" style="margin-top:10px">Đang chạy</div>${chay.map(o).join('')}`:'')+(xong.length?`<details class="xong" style="margin-top:10px"${mo?' open':''}><summary>Đã xong (${xong.length})</summary>${xong.map(o).join('')}</details>`:'')||'<p class="mo">Chưa có việc nào.</p>';
if($('#ds').dataset.h!==h){$('#ds').dataset.h=h;$('#ds').innerHTML=h}if(chon===null&&!document.getElementById('form-moi'))veNha()}
function veNha(){chon=null;clearTimeout(hen);const ds=window.dsViec;if(!ds){$('#chinh').innerHTML='';return}
const can=ds.filter(v=>['cho','loi','dung'].includes(trangThai(v)[0])),chay=ds.filter(v=>['chay','hang'].includes(trangThai(v)[0]));
const nut={cho:'Xem và duyệt',loi:'Xem lỗi',dung:'Chạy tiếp'};
const h=`<h1 data-nha>${can.length?`${can.length} việc cần bạn`:'Không có việc nào chờ bạn'}</h1>`
+can.map(v=>{const[c,t]=trangThai(v);return`<div class="o-viec" onclick="xem('${v.ten}')"><span class="cham ${c}"></span><b>${esc(v.ten)}<br><small class="mo" style="font-weight:400">${t}</small></b><button class="chinh">${nut[c]}</button></div>`}).join('')
+(chay.length?`<h2>Đang chạy</h2>`+chay.map(v=>{const[c,t]=trangThai(v);return`<div class="o-viec" onclick="xem('${v.ten}')"><span class="cham ${c}"></span><b>${esc(v.ten)}<br><small class="mo" style="font-weight:400">${t}</small></b><button>Xem</button></div>`}).join(''):'')
+(!can.length&&!chay.length?`<p class="mo">Bấm “+ Việc mới” để bắt đầu một video.</p>`:'');
if($('#chinh').dataset.nha!==h||!$('#chinh').querySelector('[data-nha]')){$('#chinh').dataset.nha=h;$('#chinh').innerHTML=h}}
let tepChon=null;
function chonDuongDan(p){tepChon=null;$('#vp').value=p;$('#tha').innerHTML=`🖥 <b>${esc(p.split('/').pop())}</b><br><small>trên Mac · ${esc(p.replace(/^\/Users\/[^/]+/,'~'))} · bấm để tải tệp khác lên</small>`;
if(!$('#ten').value)$('#ten').value=boDau(p.split('/').pop())}
async function moTep(p){let n=document.querySelector('.nen-hoi');if(!n){n=document.createElement('div');n.className='nen-hoi';n.onclick=e=>{if(e.target===n)n.remove()};document.body.appendChild(n)}
const [nh,d]=await Promise.all([api('/api/noi-nhanh'),api('/api/thu-muc'+(p?'?p='+encodeURIComponent(p):''))]);if(d.loi){return}
const kb=m=>m>=1024?(m/1024).toFixed(1)+' GB':m+' MB';const ngay=t=>new Date(t*1000).toLocaleDateString('vi-VN');
n.innerHTML=`<div class="hop-hoi duyet"><div style="display:flex;align-items:center;gap:8px"><b style="flex:1">Chọn video trên Mac</b><button onclick="this.closest('.nen-hoi').remove()">Đóng</button></div>
<div class="hang-chip">${nh.map(x=>`<button class="chip" onclick="moTep('${encodeURIComponent(x.p)}'.replace(/%/g,'%'))" data-p="${esc(x.p)}">${esc(x.ten)}</button>`).join('')}</div>
<div class="mo" style="font-size:13px;margin-top:8px;word-break:break-all">${d.cha?`<a href="#" data-p="${esc(d.cha)}" class="len">⬆ Lên</a> · `:''}${esc(d.hien)}</div>
<div class="ds-tep">${d.muc.map(m=>m.loai=='thu-muc'?`<div class="dong-tep" data-p="${esc(m.p)}" data-loai="tm"><div class="o">📁</div><div>${esc(m.ten)}</div></div>`
:`<div class="dong-tep" data-p="${esc(m.p)}" data-loai="${m.da_dung?'dd':'v'}" ${m.da_dung?'style="opacity:.45"':''}>${m.drive?'<div class="o">☁️</div>':`<img loading="lazy" src="/api/anh-nho?p=${encodeURIComponent(m.p)}" onerror="this.outerHTML='<div class=o>🎬</div>'">`}<div>${esc(m.ten)}<small>${kb(m.mb)} · ${ngay(m.luc)}${m.drive?' · trên Drive, tải về khi bắt đầu':''}${m.da_dung?' · bản đã dựng, không dùng làm gốc':''}</small></div></div>`).join('')||'<p class="mo">Không có thư mục hay video nào ở đây.</p>'}</div></div>`;
if(window.nhieu){const b=document.createElement('div');b.className='hang';b.innerHTML=`<button class="chinh" id="xongClip">Xong — ${(window.dsVideo||[]).length} clip</button><small class="mo">Bấm từng clip theo thứ tự muốn ghép; bấm lại để bỏ.</small>`;n.querySelector('.duyet').appendChild(b);b.querySelector('#xongClip').onclick=()=>{veClip();n.remove()};
n.querySelectorAll('[data-loai="v"]').forEach(e=>{if((window.dsVideo||[]).includes(e.dataset.p))e.style.outline='2px solid var(--nhan)'})}
n.querySelectorAll('[data-p]').forEach(e=>e.onclick=ev=>{ev.preventDefault();const q=e.dataset.p,l=e.dataset.loai;if(l=='v'){if(window.nhieu){themClip(q,e)}else{chonDuongDan(q);n.remove()}}else if(l=='dd'){alert('Đây là bản đã dựng — chọn video gốc quay từ máy')}else moTep(q)})}
function boDau(t){return t.normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D').toLowerCase().replace(/\.[^.]+$/,'').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,40)}
function themClip(q,e){window.dsVideo=window.dsVideo||[];const i=window.dsVideo.indexOf(q);if(i>=0){window.dsVideo.splice(i,1);e.style.outline=''}else{window.dsVideo.push(q);e.style.outline='2px solid var(--nhan)'}
const x=document.querySelector('#xongClip');if(x)x.textContent=`Xong — ${window.dsVideo.length} clip`}
function veClip(){const d=window.dsVideo||[];$('#vp').value=d[0]||'';$('#tha').innerHTML=d.length?`🎬 <b>${d.length} clip</b> (thứ tự ghép)<br><small>${d.map((p,i)=>`${i+1}. ${esc(p.split('/').pop())}`).join(' · ')}</small>`:'Kéo thả video vào đây<br><small>hoặc bấm để chọn tệp</small>';
if(!$('#ten').value&&d.length)$('#ten').value=boDau(d[0].split('/').pop())}
function nhanNhieu(fs){window.tepNhieu=[...fs].filter(f=>/\.(mp4|mov|m4v|mts|avi|mkv)$/i.test(f.name));
$('#tha').innerHTML=`🎬 <b>${window.tepNhieu.length} clip sẽ tải lên</b><br><small>${window.tepNhieu.map((f,i)=>`${i+1}. ${esc(f.name)}`).join(' · ')}</small>`;
if(!$('#ten').value&&window.tepNhieu[0])$('#ten').value=boDau(window.tepNhieu[0].name)}
function nhanTep(f){if(!f)return;if(!/\.(mp4|mov|m4v|mts|avi|mkv)$/i.test(f.name))return alert('Chỉ nhận tệp video');tepChon=f;$('#vp').value='';
$('#tha').innerHTML=`🎬 <b>${esc(f.name)}</b><br><small>${(f.size/1048576).toFixed(0)} MB · bấm để đổi tệp</small>`;if(!$('#ten').value)$('#ten').value=boDau(f.name)}
async function moMoi(){chon=null;tepChon=null;clearTimeout(hen);const ct=await api('/api/cong-thuc');setTimeout(driveMoi,0);
$('#chinh').innerHTML=`<h1 id="form-moi">Việc mới</h1><div class="the">
<div id="tha" class="tha" onclick="$('#chonTep').click()">Kéo thả video vào đây<br><small>hoặc bấm để chọn tệp</small></div>
<input type="file" id="chonTep" accept="video/*,.mts,.mkv" style="display:none" multiple onchange="window.nhieu?nhanNhieu(this.files):nhanTep(this.files[0])">
<div class="hang"><button onclick="moTep()">Chọn tệp trên Mac</button></div>
<div id="driveMoi"></div><input type="hidden" id="vp">
<div id="tien" class="tien" style="display:none"><div></div></div><div id="tienChu" class="mo" style="font-size:14px"></div>
<div class="hang" style="margin-top:18px"><button class="chinh to" id="batDau" onclick="taoMoi()">Bắt đầu</button></div>
<details class="them" id="tuyChon"><summary>Tuỳ chọn thêm</summary>
<label>Loại video</label><select id="ct" onchange="doiLoai()">${ct.map(c=>`<option value="${c.id}">${esc(c.ten)}</option>`).join('')}</select>
<div id="nguonHl" style="display:none"><label>Cắt highlight từ tập đã dựng bản dài</label><select id="tapHl" onchange="chonTapHl()"></select></div>
<label>Tên tập (chữ thường không dấu, gạch nối)</label><input id="ten" placeholder="tự đặt theo tên tệp">
<label>Khung xuất</label><select id="khung"><option value="giu">Giữ khung gốc</option><option value="ngang">Gốc dọc → xuất ngang</option><option value="doc">Gốc ngang → xuất dọc</option></select>
<label>Ảnh minh hoạ</label><select id="anhmh"><option value="mac_dinh">Chỉ khi cần</option><option value="khong">Không dùng ảnh</option><option value="them">Thêm ảnh cho mọi thứ cụ thể</option></select>
<label style="color:var(--chu)"><input type="checkbox" id="hook"> Có thẻ tít mở đầu</label>
<label>Lịch phát ghi lên thẻ cuối</label><input id="lich" placeholder="vd 20:00 thứ Ba hằng tuần">
<label>Yêu cầu riêng cho video này</label><textarea id="yc" rows="2" placeholder="thông điệp chính, chỗ muốn nhấn, điều cần tránh…"></textarea>

 if(r.ok){chon=r.ten;$('#ds').dataset.h='';danhSach();xem(chon)}}}
async function chonAnh(a){if((await api('/api/chon-anh',{ten:chon,tep:decodeURIComponent(a)})).ok)xem(chon)}
async function capNhatKhung(){if(!await hoi(`Cập nhật khung dựng cho "${chon}"?\n\nChép phần hình mới nhất của skill (thư viện hình, khung dựng) vào dự án này; GIỮ NGUYÊN kịch bản, phụ đề, thông số của video. Bản cũ được cất lại.\n\nNếu dự án đã render: app render lại cả video với khung mới (các bước Claude phía sau dùng lại kết quả cũ, không tốn token).`,'🔄 Cập nhật'))return;
const r=await api('/api/cap-nhat-khung',{ten:chon});if(r.ok){await hoi(r.ket_qua+(r.render_lai?'\n\nĐang render lại với khung mới.':''),'Đóng');xem(chon)}}
async function gopSau(loai){const g=$('#gySau').value.trim();if(!g)return alert('Viết góp ý trước');
if(!await hoi(`Gửi góp ý và làm lại ${loai=='video'?'video (kịch bản → dựng lại → cổng 2)':'bài đăng'}?\n\n«${g}»`,'Gửi góp ý'))return;
if((await api('/api/gop-y',{ten:chon,loai,gop_y:g})).ok)setTimeout(()=>xem(chon),800)}
async function donTap(){if(!await hoi('Dọn file tạm của cả tập (bản sạch, cảnh đã render, ảnh kiểm…) vào Thùng rác?\n\nGiữ: video gốc, bản cuối, bài đăng, kế hoạch. Nên dọn khi đã xong CẢ tập (bản dài + highlight) — highlight cần bản sạch của bản dài. Sửa lại sau khi dọn thì app tự dựng lại từ video gốc.','🧹 Dọn'))return;
const r=await api('/api/don-tap',{ten:chon});if(r.ok){await hoi((r.ket_qua||[]).join('\n')||'Đã dọn.','Đóng');xem(chon)}}
async function duyet(){const g=$('#gy')&&$('#gy').value.trim();
if(g){if(await hoi('Ô góp ý đang có chữ. Bấm "Duyệt" sẽ BỎ QUA góp ý này.\n\nGửi góp ý và làm lại thay vì duyệt?','Gửi góp ý, làm lại'))return gopY();return}
if(!await hoi('Duyệt cổng này và cho app chạy tiếp?\n\nMuốn sửa gì thì Huỷ, ghi vào ô góp ý rồi bấm "Gửi góp ý, làm lại".','✓ Duyệt'))return;if((await api('/api/duyet',{ten:chon})).ok)setTimeout(()=>xem(chon),800)}
async function gopY(){const g=$('#gy').value.trim();if(!g)return alert('Viết góp ý trước');if((await api('/api/duyet',{ten:chon,gop_y:g})).ok)setTimeout(()=>xem(chon),800)}
async function doiAi(ai){if((await api('/api/doi-ai',{ten:chon,ai})).ok)xem(chon)}
async function tiep(){if((await api('/api/tiep',{ten:chon})).ok)setTimeout(()=>xem(chon),800)}
async function lai(b){if(!await hoi('Làm lại từ bước này trở đi? Các bước sau đó cũng chạy lại.','Làm lại'))return;if((await api('/api/lai',{ten:chon,buoc:b})).ok)setTimeout(()=>xem(chon),800)}
function gio(t){if(!t)return'';const d=new Date(t*1000),n=new Date(),hh=d.toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit'});return d.toDateString()==n.toDateString()?hh:hh+' '+d.getDate()+'/'+(d.getMonth()+1)}
function veHanMuc(h){const ten={five_hour:'5 giờ',seven_day:'7 ngày'};const tk=(h&&h.tai_khoan)||{};
const dongTk=h&&h.dang_cho_dang_nhap?`<div class="d" style="color:var(--vang)">Đang chờ bạn đăng nhập Claude trên trình duyệt…</div>`
 :tk.dang_nhap?`<div class="d" title="App chạy bằng tài khoản Claude đang đăng nhập trên máy này"><span style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(tk.email||'?')}${tk.goi?' · '+esc(tk.goi):''}</span><button onclick="doiTaiKhoan(this)">Đổi</button></div>`
 :`<div class="d" style="color:var(--do)">Chưa đăng nhập Claude <button onclick="doiTaiKhoan(this)">Đăng nhập</button></div>`;
const mau=p=>p>80?'var(--do)':p>=50?'var(--vang)':'var(--xanh)';
const lamMoi=`<button title="Hỏi lại ngay (0 token)" onclick="lamMoiHanMuc(this)">↻</button>`;
if(!h||!h.five_hour){$('#hm').innerHTML=`<summary>Claude${tk.dang_nhap===false||!tk.dang_nhap&&h?' · <span style="color:var(--do)">chưa đăng nhập</span>':''}</summary><div class="d">Hạn mức chưa đọc được ${lamMoi}</div>`+dongTk;return}
const cao=Math.max(...['five_hour','seven_day'].map(k=>(h[k]||{}).dung||0));
$('#hm').innerHTML=`<summary><span class="cham" style="background:${mau(cao)}"></span>Claude ${h.five_hour.dung}% · tuần ${(h.seven_day||{}).dung??'?'}%</summary>`
 +['five_hour','seven_day'].filter(k=>h[k]).map(k=>`<div class="d"><span style="width:44px">${ten[k]}</span><span class="t"><i style="width:${h[k].dung}%;background:${mau(h[k].dung)}"></i></span><span>mở lại ${gio(h[k].mo_lai)}</span></div>`).join('')
 +`<div class="d">Cập nhật ${gio(h.luc)} ${lamMoi}</div>`+dongTk+(cao>90?'<div class="canh">Sắp hết hạn mức — việc đang chạy có thể dừng giữa chừng.</div>':'')}
async function doiTaiKhoan(b){if(!confirm('Đăng xuất tài khoản Claude hiện tại và mở trang đăng nhập trên trình duyệt?\nApp sẽ chạy bằng tài khoản bạn đăng nhập.'))return;b.disabled=true;const r=await api('/api/doi-tai-khoan',{});if(r.ok)setTimeout(hanMuc,1500)}
async function hanMuc(){try{const r=await fetch('/api/han-muc');veHanMuc(await r.json())}catch(e){}}
async function lamMoiHanMuc(b){b.disabled=true;b.textContent='…';veHanMuc(await api('/api/han-muc',{}))}
danhSach();setInterval(danhSach,5000);hanMuc();setInterval(hanMuc,10000);
</script></body></html>
