<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dựng video</title>
<style>
:root{--nen:#f6f5f2;--the:#fff;--chu:#1d1d1b;--phu:#6b6a66;--vien:#e3e1dc;--nhan:#e8742c;--xanh:#2e8b57;--do:#c0392b;--vang:#c98a00}
@media (prefers-color-scheme:dark){:root{--nen:#151514;--the:#1f1f1d;--chu:#ecebe7;--phu:#9a9892;--vien:#33322f}}
*{box-sizing:border-box}body{margin:0;background:var(--nen);color:var(--chu);font:15px/1.5 -apple-system,system-ui,sans-serif}
.khung{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
aside{border-right:1px solid var(--vien);padding:16px;background:var(--the)}
main{padding:20px 24px;max-width:1100px;min-width:0;overflow-wrap:anywhere}
h1{font-size:18px;margin:0 0 12px}h2{font-size:16px;margin:20px 0 8px}
button{font:inherit;border:1px solid var(--vien);background:var(--the);color:var(--chu);border-radius:8px;padding:7px 12px;cursor:pointer}
button.chinh{background:var(--nhan);border-color:var(--nhan);color:#fff;font-weight:600}
button:disabled{opacity:.5;cursor:default}
.viec{padding:8px 10px;border-radius:8px;cursor:pointer;margin-bottom:4px}.viec:hover,.viec.chon{background:var(--nen)}
.viec small{display:block;color:var(--phu)}
.buoc{display:flex;gap:10px;align-items:center;padding:5px 0;border-bottom:1px solid var(--vien)}
.buoc .loai{font-size:12px;color:var(--phu);margin-left:auto}.buoc .lai{font-size:12px;padding:2px 8px}
.the{background:var(--the);border:1px solid var(--vien);border-radius:12px;padding:16px;margin:12px 0}
pre{white-space:pre-wrap;word-break:break-word;background:var(--nen);padding:12px;border-radius:8px;max-height:420px;overflow:auto;font:13px/1.45 ui-monospace,Menlo,monospace}
textarea,input,select{font:inherit;width:100%;padding:8px;border:1px solid var(--vien);border-radius:8px;background:var(--the);color:var(--chu)}
label{display:block;margin:10px 0 4px;color:var(--phu);font-size:13px}
video{width:100%;max-height:480px;background:#000;border-radius:8px}
.hang{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.mo{color:var(--phu)}
.tha{overflow-wrap:anywhere;min-width:0;border:2px dashed var(--vien);border-radius:12px;padding:28px 16px;text-align:center;cursor:pointer;color:var(--phu)}.tha.tren{border-color:var(--nhan);color:var(--nhan)}
.tien{height:8px;background:var(--nen);border-radius:4px;overflow:hidden;margin-top:8px}.tien>div{height:100%;width:0;background:var(--nhan)}
button.dung{border-color:var(--do);color:var(--do)}
.nen-hoi{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:9}
.hop-hoi{background:var(--the);border:1px solid var(--vien);border-radius:12px;padding:20px;max-width:560px;width:100%;white-space:pre-wrap}
.duyet{max-width:720px;max-height:86vh;display:flex;flex-direction:column;white-space:normal}
.ds-tep{overflow-y:auto;flex:1;margin-top:8px}.dong-tep{display:flex;gap:10px;align-items:center;padding:8px;border-radius:8px;cursor:pointer;border-bottom:1px solid var(--vien)}.dong-tep:hover{background:var(--nen)}
.dong-tep img,.dong-tep .o{width:64px;height:40px;object-fit:cover;border-radius:6px;background:var(--nen);flex:0 0 64px;display:flex;align-items:center;justify-content:center}
.dong-tep>div:last-child{min-width:0;overflow-wrap:anywhere}.dong-tep small{display:block;color:var(--phu)}.chip{font-size:13px;padding:5px 10px;flex:0 0 auto!important;white-space:nowrap}.hang-chip{display:flex;gap:6px;overflow-x:auto;margin-top:10px;padding-bottom:4px}
.so{display:flex;gap:16px;color:var(--phu);font-size:13px}
@media (max-width:760px){.khung{grid-template-columns:1fr;grid-template-rows:auto 1fr;min-height:0}aside{border-right:0;border-bottom:1px solid var(--vien);padding:12px 16px}main{padding:16px}#ds{display:flex;gap:6px;overflow-x:auto;margin-top:10px!important}.viec{flex:0 0 auto;margin:0;border:1px solid var(--vien)}.buoc .lai{display:none}.hang button{flex:1}video{max-height:60vh}}
</style></head><body>
<div class="khung">
<aside><h1>Dựng video</h1><button class="chinh" onclick="moMoi()">+ Việc mới</button><div id="ds" style="margin-top:14px"></div></aside>
<main id="chinh"><p class="mo">Chọn một việc trong danh sách, hoặc bấm "+ Việc mới".</p></main>
</div>
<script>
const $=s=>document.querySelector(s);let chon=null,hen=null;
const BIEU={'xep-hang':'⏳','bo-qua':'–','da-dung':'⏸',xong:'✅','da-duyet':'✅','dang-chay':'⏳',loi:'❌','cho-duyet':'🟠',chua:'·'};
const LOAI={'co-dinh':'máy','claude':'Claude','duyet':'David duyệt'};
const esc=s=>(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
async function api(u,d){const r=await fetch(u,d?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)}:{});const j=await r.json();if(!r.ok)alert(j.loi||'lỗi');return j}
async function danhSach(){const ds=await api('/api/viec');const h=ds.map(v=>`<div class="viec ${v.ten==chon?'chon':''}" onclick="xem('${v.ten}')">${BIEU[v.trang_thai]||'·'} ${esc(v.ten)}<small>${v.dang_chay?'đang chạy · ':''}${esc(v.dang||'xong')}</small></div>`).join('')||'<p class="mo">Chưa có việc nào.</p>';if($('#ds').dataset.h!==h){$('#ds').dataset.h=h;$('#ds').innerHTML=h}}
let tepChon=null;
function chonDuongDan(p){tepChon=null;$('#vp').value=p;$('#tha').innerHTML=`🖥 <b>${esc(p.split('/').pop())}</b><br><small>trên Mac · ${esc(p.replace(/^\/Users\/[^/]+/,'~'))} · bấm để tải tệp khác lên</small>`;
if(!$('#ten').value)$('#ten').value=boDau(p.split('/').pop())}
async function moTep(p){let n=document.querySelector('.nen-hoi');if(!n){n=document.createElement('div');n.className='nen-hoi';n.onclick=e=>{if(e.target===n)n.remove()};document.body.appendChild(n)}
const [nh,d]=await Promise.all([api('/api/noi-nhanh'),api('/api/thu-muc'+(p?'?p='+encodeURIComponent(p):''))]);if(d.loi){return}
const kb=m=>m>=1024?(m/1024).toFixed(1)+' GB':m+' MB';const ngay=t=>new Date(t*1000).toLocaleDateString('vi-VN');
n.innerHTML=`<div class="hop-hoi duyet"><div style="display:flex;align-items:center;gap:8px"><b style="flex:1">Chọn video trên Mac</b><button onclick="this.closest('.nen-hoi').remove()">Đóng</button></div>
<div class="hang-chip">${nh.map(x=>`<button class="chip" onclick="moTep('${encodeURIComponent(x.p)}'.replace(/%/g,'%'))" data-p="${esc(x.p)}">${esc(x.ten)}</button>`).join('')}</div>
<div class="mo" style="font-size:13px;margin-top:8px;word-break:break-all">${d.cha?`<a href="#" data-p="${esc(d.cha)}" class="len">⬆ Lên</a> · `:''}${esc(d.hien)}</div>
<div class="ds-tep">${d.muc.map(m=>m.loai=='thu-muc'?`<div class="dong-tep" data-p="${esc(m.p)}" data-loai="tm"><div class="o">📁</div><div>${esc(m.ten)}</div></div>`
:`<div class="dong-tep" data-p="${esc(m.p)}" data-loai="${m.da_dung?'dd':'v'}" ${m.da_dung?'style="opacity:.45"':''}>${m.drive?'<div class="o">☁️</div>':`<img loading="lazy" src="/api/anh-nho?p=${encodeURIComponent(m.p)}" onerror="this.outerHTML='<div class=o>🎬</div>'">`}<div>${esc(m.ten)}<small>${kb(m.mb)} · ${ngay(m.luc)}${m.drive?' · trên Drive, tải về khi bắt đầu':''}${m.da_dung?' · bản đã dựng, không dùng làm gốc':''}</small></div></div>`).join('')||'<p class="mo">Không có thư mục hay video nào ở đây.</p>'}</div></div>`;
n.querySelectorAll('[data-p]').forEach(e=>e.onclick=ev=>{ev.preventDefault();const q=e.dataset.p,l=e.dataset.loai;if(l=='v'){chonDuongDan(q);n.remove()}else if(l=='dd'){alert('Đây là bản đã dựng — chọn video gốc quay từ máy')}else moTep(q)})}
function boDau(t){return t.normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D').toLowerCase().replace(/\.[^.]+$/,'').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,40)}
function nhanTep(f){if(!f)return;if(!/\.(mp4|mov|m4v|mts|avi|mkv)$/i.test(f.name))return alert('Chỉ nhận tệp video');tepChon=f;$('#vp').value='';
$('#tha').innerHTML=`🎬 <b>${esc(f.name)}</b><br><small>${(f.size/1048576).toFixed(0)} MB · bấm để đổi tệp</small>`;if(!$('#ten').value)$('#ten').value=boDau(f.name)}
async function moMoi(){chon=null;tepChon=null;clearTimeout(hen);const ct=await api('/api/cong-thuc');setTimeout(driveMoi,0);
$('#chinh').innerHTML=`<h1>Việc mới</h1><div class="the"><label>Loại video</label><select id="ct">${ct.map(c=>`<option value="${c.id}">${esc(c.ten)}</option>`).join('')}</select>
<label>Video gốc</label><div id="tha" class="tha" onclick="$('#chonTep').click()">Kéo thả video vào đây<br><small>hoặc bấm để chọn tệp</small></div>
<input type="file" id="chonTep" accept="video/*,.mts,.mkv" style="display:none" onchange="nhanTep(this.files[0])">
<div class="hang" style="margin-top:8px"><button onclick="moTep()">📁 Chọn tệp trên Mac</button></div>
<div id="driveMoi"></div>
<label>Hoặc dán link Google Drive (tệp phải nằm trong Drive đã liên kết với Mac)</label>
<div style="display:flex;gap:8px;min-width:0"><input id="link" style="min-width:0;flex:1" placeholder="https://drive.google.com/file/d/…" onkeydown="if(event.key=='Enter')timLink()"><button style="flex:0 0 auto" onclick="timLink()">Tìm</button></div>
<div id="linkKq" class="mo" style="font-size:13px;margin-top:4px"></div><input type="hidden" id="vp">
<label>Tên tập (tự đặt theo tên tệp, sửa được: chữ thường không dấu, gạch nối)</label><input id="ten" placeholder="ten-tap">
<label>Khung xuất</label><select id="khung"><option value="giu">Giữ khung gốc (mặc định)</option><option value="ngang">Gốc dọc → xuất ngang (video giữa, chữ hai bên)</option><option value="doc">Gốc ngang → xuất dọc (bám người nói)</option></select>
<label>Ảnh minh hoạ</label><select id="anhmh"><option value="mac_dinh">Chỉ khi cần — mặc định dùng biểu tượng vẽ</option><option value="khong">Không dùng ảnh nào</option><option value="them">Thêm ảnh cho mọi thứ cụ thể</option></select>
<label style="display:flex;gap:8px;align-items:center;color:var(--chu)"><input type="checkbox" id="hook" style="width:auto"> Có thẻ tít mở đầu (mặc định không)</label>
<label>Lịch phát ghi lên thẻ cuối (tuỳ chọn, vd "20:00 thứ Ba hằng tuần")</label><input id="lich">
<label>Yêu cầu riêng cho video này (tuỳ chọn: thông điệp chính, chỗ muốn nhấn, điều cần tránh…)</label><textarea id="yc" rows="2"></textarea>
<div id="tien" class="tien" style="display:none"><div></div></div><div id="tienChu" class="mo" style="font-size:13px"></div>
<div class="hang"><button class="chinh" id="batDau" onclick="taoMoi()">Bắt đầu</button></div></div>`;
const t=$('#tha');['dragenter','dragover'].forEach(e=>t.addEventListener(e,v=>{v.preventDefault();t.classList.add('tren')}));
['dragleave','drop'].forEach(e=>t.addEventListener(e,v=>{v.preventDefault();t.classList.remove('tren')}));t.addEventListener('drop',v=>nhanTep(v.dataTransfer.files[0]))}
function taiLen(ten,f){return new Promise((ok,hong)=>{const x=new XMLHttpRequest();x.open('POST',`/api/tai-len?ten=${encodeURIComponent(ten)}&tep=${encodeURIComponent(f.name)}`);
$('#tien').style.display='block';x.upload.onprogress=e=>{const p=e.loaded/e.total*100;$('#tien>div').style.width=p+'%';$('#tienChu').textContent=`Đang tải lên ${p.toFixed(0)}% (${(e.loaded/1048576).toFixed(0)}/${(e.total/1048576).toFixed(0)} MB)`};
x.onload=()=>{const j=JSON.parse(x.responseText);x.status==200?ok(j.duong_dan):hong(j.loi)};x.onerror=()=>hong('mất kết nối khi tải lên');x.send(f)})}
async function driveMoi(){const ds=await api('/api/drive-moi');if(!$('#driveMoi'))return;
$('#driveMoi').innerHTML=ds.length?`<label>Mới trong Drive Video-goc — bấm để chọn</label><div class="hang-chip">${ds.map(x=>`<button class="chip" data-p="${esc(x.p)}">☁️ ${esc(x.ten)} <small class="mo">· ${x.mb} MB · ${new Date(x.luc*1000).toLocaleDateString('vi-VN')}</small></button>`).join('')}</div>`:'<div class="mo" style="font-size:13px;margin-top:6px">Drive Video-goc đang trống — tải video vào đó từ điện thoại, vài phút sau sẽ hiện ở đây.</div>';
$('#driveMoi').querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>chonDuongDan(b.dataset.p))}
async function timLink(){const l=$('#link').value.trim();if(!l)return;$('#linkKq').textContent='Đang tìm trên Mac…';
const r=await fetch('/api/tu-link?link='+encodeURIComponent(l)).then(x=>x.json());
if(r.loi){$('#linkKq').textContent='⚠ '+r.loi;return}
if(r.loai=='video'){chonDuongDan(r.p);$('#linkKq').textContent='✓ Đã thấy tệp trên Mac'}else{$('#linkKq').textContent='Link là một thư mục — mở để chọn video';moTep(r.p)}}
async function taoMoi(){const ten=$('#ten').value.trim();if(!/^[a-z0-9-]+$/.test(ten))return alert('Tên: chữ thường không dấu, số, gạch nối');
let video=$('#vp').value.trim();if(!tepChon&&!video)return alert('Kéo thả hoặc chọn một video');$('#batDau').disabled=true;
try{if(tepChon)video=await taiLen(ten,tepChon)}catch(e){$('#batDau').disabled=false;return alert(e)}
$('#tienChu').textContent='Đã tải lên, bắt đầu chạy…';const r=await api('/api/moi',{ten,video,cong_thuc:$('#ct').value,tuy_chon:{khung:$('#khung').value,anh:$('#anhmh').value,hook:$('#hook').checked,lich:$('#lich').value.trim(),yeu_cau:$('#yc').value.trim()}});$('#batDau').disabled=false;if(r.ok){chon=ten;setTimeout(()=>xem(ten),800)}}
async function xem(ten){const moi=chon!==ten;chon=ten;clearTimeout(hen);const d=await api('/api/chi-tiet?ten='+encodeURIComponent(ten));danhSach();
const tk=d.token;let h=`<div style="display:flex;align-items:center;gap:12px"><h1 style="margin:0">${esc(d.ten)}</h1><button class="dung" style="margin-left:auto;font-size:13px" ${d.dang_chay?'disabled title="Dừng việc trước khi xoá"':''} onclick="xoaViec()">🗑 Xoá dự án</button></div><div class="hang" style="margin-top:6px"><button style="font-size:13px" ${d.dang_chay?'disabled title="Dừng việc trước"':''} onclick="capNhatKhung()">🔄 Cập nhật khung dựng</button></div><div class="so"><span>${esc(d.cong_thuc)}</span><span>Claude: ${tk.lan_goi} lần · ${(tk.vao/1000).toFixed(1)}k vào · ${(tk.ra/1000).toFixed(1)}k ra</span></div>`;
if(d.cong){h+=`<div class="the"><h2>🟠 ${esc(d.cong.ten)}</h2>${d.cong.video?`<video controls preload="metadata" src="/tep?p=${encodeURIComponent(d.cong.video)}"></video>`:''}
${d.cong.chon_anh?`<h2>${esc(d.cong.chon_anh.nhan)}</h2><div class="hang">${d.cong.chon_anh.ds.map((a,i)=>`<div style="flex:1;min-width:220px"><img src="/tep?p=${encodeURIComponent(a)}&v=${Date.now()}" style="width:100%;border-radius:8px;border:3px solid ${d.cong.chon_anh.da_chon==a?'var(--nhan)':'transparent'}"><button style="width:100%;margin-top:4px" ${d.cong.chon_anh.da_chon==a?'class="chinh"':''} onclick="chonAnh('${encodeURIComponent(a)}')">${d.cong.chon_anh.da_chon==a?'✓ Đã chọn':'Chọn mẫu '+(i+1)}</button></div>`).join('')}</div>`:''}
${d.cong.anh.map(a=>`<h2>${esc(a.split('/').pop())}</h2><a href="/tep?p=${encodeURIComponent(a)}" target="_blank"><img src="/tep?p=${encodeURIComponent(a)}&v=${Date.now()}" style="width:100%;border-radius:8px"></a>`).join('')}
${d.cong.tep.map(t=>`<h2>${esc(t.ten)}</h2><pre>${esc(t.noi_dung)}</pre>`).join('')}
${d.cong.nhan_gop_y?`<label>Góp ý (để trống nếu duyệt luôn) — Claude chỉ sửa đúng chỗ được nhắc</label><textarea id="gy" rows="3"></textarea>`:''}
<div class="hang"><button class="chinh" ${d.dang_chay?'disabled':''} onclick="duyet()">Duyệt, chạy tiếp</button>${d.cong.nhan_gop_y?`<button ${d.dang_chay?'disabled':''} onclick="gopY()">Gửi góp ý, làm lại</button>`:''}</div></div>`}
if(d.dang_chay)h+=`<div class="hang"><button class="dung" onclick="dungViec()">⏹ Dừng việc đang chạy</button></div>`;
const ngung=d.buoc.find(b=>b.trang_thai=='da-dung');if(ngung&&!d.dang_chay)h+=`<div class="the">⏸ Đã dừng ở bước "${esc(ngung.ten)}".<div class="hang"><button class="chinh" onclick="tiep()">▶ Chạy tiếp</button></div></div>`;
const rs=d.ra_soat||{buoc_cu:[],khung_cu:[]};const cuIds=new Set(rs.buoc_cu.map(x=>x.id));
if(!d.dang_chay&&(rs.buoc_cu.length||rs.khung_cu.length))h+=`<div class="the" style="border-color:var(--vang)"><b>⚠ Skill đã đổi sau khi dự án này chạy</b>
${rs.buoc_cu.length?`<div style="margin-top:6px">Bước bị ảnh hưởng: ${rs.buoc_cu.map(x=>`<b>${esc(x.ten)}</b> <small class="mo">(${esc(x.tep.slice(0,4).join(', '))}${x.tep.length>4?'…':''})</small>`).join(' · ')}</div>
<div class="hang"><button class="chinh" onclick="lai('${rs.buoc_cu[0].id}')">Làm lại từ "${esc(rs.buoc_cu[0].ten)}"</button></div><small class="mo">Bước Claude nào đầu vào không đổi sẽ dùng lại kết quả cũ (0 token).</small>`:''}
${rs.khung_cu.length?`<div style="margin-top:8px">Phần hình (khung dựng) cũ hơn skill: ${rs.khung_cu.length} tệp <small class="mo">(${esc(rs.khung_cu.slice(0,5).join(', '))}${rs.khung_cu.length>5?'…':''})</small></div><div class="hang"><button onclick="capNhatKhung()">🔄 Cập nhật khung dựng</button></div>`:''}</div>`;
const loi=d.buoc.find(b=>b.trang_thai=='loi');
if(loi&&!d.dang_chay)h+=`<div class="the"><b>❌ Lỗi ở bước "${esc(loi.ten)}"</b><pre>${esc(d.log)}</pre><div class="hang"><button class="chinh" onclick="tiep()">Chạy lại bước này</button></div></div>`;
if(d.xong_luc)h+=`<div class="the">✅ Xong lúc ${esc(d.xong_luc)} · <span class="mo">${esc(d.P)}/video-final.mp4</span></div>`;
const xh=d.buoc.find(b=>b.trang_thai=='xep-hang');if(xh&&d.dang_chay)h+=`<div class="the">⏳ <b>Đang xếp hàng</b> ở bước "${esc(xh.ten)}" — máy đang làm bước nặng của: <b>${esc(d.hang_doi||'việc khác')}</b>. Mỗi lúc chỉ một việc chạy bước nặng (render, chép lời, dò mặt) để Mac không quá tải; tới lượt sẽ tự chạy.</div>`;
h+=`<h2>Các bước</h2>`+d.buoc.map(b=>`<div class="buoc" ${b.trang_thai=='bo-qua'?'style="opacity:.45"':''}><span>${BIEU[b.trang_thai]||'·'}</span><span>${esc(b.ten)}${cuIds.has(b.id)?' <span title="skill đã đổi sau khi bước này chạy" style="color:var(--vang)">⚠</span>':''}</span><span class="loai">${b.trang_thai=='bo-qua'?'bỏ qua — không cần cho video này':b.trang_thai=='xep-hang'?'đang xếp hàng':LOAI[b.loai]+' '+(b.luc?'· '+b.luc:'')}</span>${b.loai!='duyet'&&!d.dang_chay&&b.trang_thai!='chua'?`<button class="lai" onclick="lai('${b.id}')">làm lại từ đây</button>`:''}</div>`).join('');
if(d.dang_chay&&d.log)h+=`<h2>Đang chạy: ${esc(d.dang)}</h2><pre>${esc(d.log)}</pre>`;
$('#chinh').innerHTML=h;if(moi&&innerWidth<760)$('#chinh').scrollIntoView({behavior:'smooth'});if(d.dang_chay)hen=setTimeout(()=>xem(ten),3000)}
// Hộp xác nhận vẽ trong trang (khung trình duyệt của Claude chặn confirm() mặc định)
function hoi(noiDung,nut='Đồng ý',nguyHiem=false){return new Promise(ok=>{const n=document.createElement('div');n.className='nen-hoi';
n.innerHTML=`<div class="hop-hoi"><div>${esc(noiDung)}</div><div class="hang" style="justify-content:flex-end"><button id="hoiKhong">Huỷ</button><button id="hoiCo" class="${nguyHiem?'dung':'chinh'}">${esc(nut)}</button></div></div>`;
document.body.appendChild(n);const xong=v=>{n.remove();ok(v)};n.querySelector('#hoiKhong').onclick=()=>xong(false);n.querySelector('#hoiCo').onclick=()=>xong(true);n.onclick=e=>{if(e.target===n)xong(false)}})}
async function dungViec(){if(!await hoi('Dừng việc này? Bước đang chạy sẽ làm lại từ đầu khi bấm Chạy tiếp.','⏹ Dừng',true))return;if((await api('/api/dung',{ten:chon})).ok)setTimeout(()=>xem(chon),500)}
async function xoaViec(){const ds=await api('/api/thu-xoa?ten='+encodeURIComponent(chon));
if(!await hoi(`Xoá dự án "${chon}"?\n\nCác thư mục sau sẽ chuyển vào Thùng rác (muốn lấy lại: mở Thùng rác, kéo thư mục về ~/Movies; dọn Thùng rác là mất hẳn):\n\n${ds.map(x=>'• '+x.duong_dan+' ('+x.mb+' MB)').join('\n')}\n\nGồm cả video gốc trong 1-goc.`,'🗑 Xoá dự án',true))return;
if((await api('/api/xoa',{ten:chon})).ok){chon=null;$('#chinh').innerHTML='<p class="mo">Đã chuyển vào Thùng rác.</p>';$('#ds').dataset.h='';danhSach()}}
async function chonAnh(a){if((await api('/api/chon-anh',{ten:chon,tep:decodeURIComponent(a)})).ok)xem(chon)}
async function capNhatKhung(){if(!await hoi(`Cập nhật khung dựng cho "${chon}"?\n\nChép phần hình mới nhất của skill (thư viện hình, khung dựng) vào dự án này; GIỮ NGUYÊN kịch bản, phụ đề, thông số của video. Bản cũ được cất lại.\n\nNếu dự án đã render: app render lại cả video với khung mới (các bước Claude phía sau dùng lại kết quả cũ, không tốn token).`,'🔄 Cập nhật'))return;
const r=await api('/api/cap-nhat-khung',{ten:chon});if(r.ok){await hoi(r.ket_qua+(r.render_lai?'\n\nĐang render lại với khung mới.':''),'Đóng');xem(chon)}}
async function duyet(){if((await api('/api/duyet',{ten:chon})).ok)setTimeout(()=>xem(chon),800)}
async function gopY(){const g=$('#gy').value.trim();if(!g)return alert('Viết góp ý trước');if((await api('/api/duyet',{ten:chon,gop_y:g})).ok)setTimeout(()=>xem(chon),800)}
async function tiep(){if((await api('/api/tiep',{ten:chon})).ok)setTimeout(()=>xem(chon),800)}
async function lai(b){if(!await hoi('Làm lại từ bước này trở đi? Các bước sau đó cũng chạy lại.','Làm lại'))return;if((await api('/api/lai',{ten:chon,buoc:b})).ok)setTimeout(()=>xem(chon),800)}
danhSach();setInterval(danhSach,5000);
</script></body></html>
